name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can — it helps a lot with diagnosing the problem.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      description: Please confirm the following before submitting.
      options:
        - label: I'm running the latest version of RC Mounter for DJI
          required: true
        - label: I've checked the [existing issues](https://github.com/temmink/RCMounterForDJI/issues) and this hasn't been reported before
          required: true
        - label: My DJI controller is powered on and connected via USB-C

  - type: dropdown
    id: macos_version
    attributes:
      label: macOS Version
      description: Which version of macOS are you running?
      options:
        - macOS 26 (Tahoe)
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
        - macOS 13 (Ventura)
        - Other (please describe below)
    validations:
      required: true

  - type: dropdown
    id: controller
    attributes:
      label: DJI Controller Model
      description: Which DJI controller are you connecting?
      options:
        - DJI RC2
        - DJI RC Pro 2
        - DJI RC Pro
        - Other (please describe below)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - USB connection / device detection
        - Files tab (MTP file browser)
        - Media tab (photos / videos)
        - Media tab — file deletion
        - Media tab — file download
        - Waypoints tab
        - Finder mount (FileProvider)
        - Settings
        - App launch / splash screen
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect to happen, and what actually happened?
      placeholder: "e.g. I clicked Download on a movie file and the progress bar appeared but the file never arrived in my Downloads folder."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Connect your DJI controller via USB-C
        2. Open the Media tab
        3. Select SD Card as source
        4. Click Download on any movie file
        5. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output (if available)
      description: |
        Enable **Advanced Options** in Settings, open the **Logs** tab, reproduce the issue, then paste the relevant log lines here.
        Logs help enormously with USB and MTP issues.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, cable/hub details, or anything else that might be relevant.
